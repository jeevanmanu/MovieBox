<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Moviebox</title>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/4.7.0/css/font-awesome.min.css">

    <style>
        body {
            margin: 0;
            background: linear-gradient(to top, rgb(20, 24, 28), rgb(27, 34, 40));
            background-attachment: fixed;
            font-family: Arial, Helvetica, sans-serif;
            overflow-x: hidden;
        }

        /* Navbar Styling */
        .name {
            display: flex;
            justify-content: space-between;
            align-items: center;
            background-color: rgb(27, 34, 40);
            width: 100%;
            padding: 10px 40px;
            box-sizing: border-box;
            margin-left: 250px;
        }

        .main {
            display: flex;
            align-items: center;
            font-size: xx-large;
            font-weight: 800;
            color: white;
            text-decoration: none;
        }

        .main img {
            width: 40px;
            height: 40px;
            margin-right: 10px;
        }

        .nav {
            display: flex;
            align-items: center;
            gap: 20px;
            margin-right: 500px;
        }

        .nav a {
            color: white;
            text-decoration: none;
            font-size: large;
            font-weight: bold;
        }

        .search {
            display: flex;
            align-items: center;
            height: 30px;
            width: 190px;
            border-radius: 20px;
            padding: 0 10px;
            background: rgba(255, 255, 255, 0.2);
            transition: 0.2s ease;
        }

        .search:hover {
            background-color: white;
        }

        .search input {
            border: none;
            outline: none;
            background: transparent;
            width: 100%;
            color: white;
        }

        .search:hover input {
            color: black;
        }

        .search i {
            color: white;
        }

        .search:hover i {
            color: grey;
        }

        /* Main Content Centered Container */
        .container {
            max-width: 950px;
            margin: 30px auto;
            padding: 0 20px;
        }

        /* Filter Header Bar */
        .filter-bar {
            display: flex;
            justify-content: space-between;
            align-items: center;
            border-bottom: 2px solid grey;
            padding-bottom: 8px;
            margin-bottom: 20px;
            font-family: "Graphik", -apple-system, BlinkMacSystemFont, sans-serif;
        }

        .filter-title {
            color: rgb(154, 154, 154);
            font-size: 14px;
            font-weight: bold;
            letter-spacing: 0.05em;
        }

        .filters {
            display: flex;
            gap: 15px;
        }

        .filters span {
            color: rgb(154, 154, 154);
            cursor: pointer;
            font-size: 12px;
            font-weight: bold;
            letter-spacing: 0.05em;
            transition: color 0.2s;
        }

        .filters span:hover {
            color: #40bcf4;
        }

        /* Movie Poster Grid */
        #films {
            display: grid;
            grid-template-columns: repeat(6, 1fr);
            gap: 12px;
            width: 100%;
            box-sizing: border-box;
        }

        .film {
            aspect-ratio: 2 / 3;
            position: relative;
            overflow: hidden;
            border-radius: 4px;
            cursor: pointer;
            border: 1px solid rgba(255, 255, 255, 0.1);
            background-color: #1b2228;
        }

        .film img {
            width: 100%;
            height: 100%;
            object-fit: cover;
            transition: transform 0.2s ease, filter 0.2s ease;
        }

        .film:hover img {
            transform: scale(1.05);
            filter: brightness(80%);
        }

        .film:hover {
            border-color: #00e054;
        }
        footer {
            text-align: center;
            padding: 20px;
            margin-top: 30px;
            font-size: 20px;
            color: rgb(212, 202, 202);
            border-top: 2px solid grey;
        }
    </style>
</head>
<body>

    <div class="name">
        <a href="#" class="main"><img src="icon1.png" alt="Moviebox">Moviebox</a>  
        <div class="nav">
            <a href="index.html">Sign In</a>
            <a href="films.html">Films</a>
            <a href="reviews.html">Reviews</a>
            <div class="search">
                <input type="text" placeholder="Search...">
                <i class="fa fa-search"></i>
            </div>
        </div>
    </div>

    <div class="container">
        <div class="filter-bar">
            <span class="filter-title">FILMS</span>
            <div class="filters">
                <span>DECADE &#9662;</span>
                <span>GENRE &#9662;</span>
                <span>SERVICE &#9662;</span>
            </div>
        </div>

        <div id="films">
            <div class="film"><img src="films/1.jpg" alt="Movie Poster"></div>
            <div class="film"><img src="films/2.jpg" alt="Movie Poster"></div>
            <div class="film"><img src="films/3.jpg" alt="Movie Poster"></div>
            <div class="film"><img src="films/4.jpg" alt="Movie Poster"></div>
            <div class="film"><img src="films/5.jpg" alt="Movie Poster"></div>
            <div class="film"><img src="films/6.jpg" alt="Movie Poster"></div>
            <div class="film"><img src="films/7.jpg" alt="Movie Poster"></div>
            <div class="film"><img src="films/8.jpg" alt="Movie Poster"></div>
            <div class="film"><img src="films/9.jpg" alt="Movie Poster"></div>
            <div class="film"><img src="films/10.jpg" alt="Movie Poster"></div>
            <div class="film"><img src="films/11.jpg" alt="Movie Poster"></div>
            <div class="film"><img src="films/12.jpg" alt="Movie Poster"></div>
            <div class="film"><img src="films/13.jpg" alt="Movie Poster"></div>
            <div class="film"><img src="films/14.jpg" alt="Movie Poster"></div>
            <div class="film"><img src="films/a.jpg" alt="Movie Poster"></div>
            <div class="film"><img src="films/b.jpg" alt="Movie Poster"></div>
            <div class="film"><img src="films/c.jpg" alt="Movie Poster"></div>
            <div class="film"><img src="films/d.jpg" alt="Movie Poster"></div>
        </div>
    </div>
    <footer>
    <p>© 2026 Moviebox. All rights reserved.</p>
</footer>

</body>
</html>
